{% extends "admin/change_form.html" %}
{% load core_tags %}
{% load static %}

{% block content %}
    {{ block.super }}
    <div id="perplexity-data"
         data-article-id="{{ original.id }}">
         <input type="hidden" id="nombre-asistente" value="{% get_nombre_del_asistente %}">
    </div>

{% endblock %}

{% block extrahead %}
    {{ block.super }}
    {% if user|in_group:"use_ia" %}
        <link rel="stylesheet" href="{% static 'css/perplexity_admin.css' %}">
        <script src="{% static 'js/perplexity_button.js' %}"></script>
    {% endif %}
{% endblock %}
