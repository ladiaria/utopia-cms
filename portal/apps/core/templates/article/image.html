{% load bleach_tags core_tags ldml %}

{% if image.is_public %}{# don't indent this block, it get broken and we don't know why #}
<div class="inline-image-wrap article_body_image-{{ display }}">
  <figure class="principal">
    <img
      class="materialboxed responsive-img {% if image.extended.is_landscape %}landscape{% else %}portrait{% endif %}"
      {% if display == "FW" %}
        srcset="{{ image.get_250w_url }} 250w, {{ image.get_700w_url }} 700w, {{ image.get_900w_url }} 900w, {{ image.get_1200w_url }} 1200w, {{ image.get_fullscreen_url }} 2000w"
      {% elif display == "MD" %}
        srcset="{{ image.get_250w_url }} 250w, {{ image.get_700w_url }} 700w, {{ image.get_900w_url }} 900w, {{ image.get_1192w_url }} 1192w"
      {% elif display == "BG" %}
        srcset="{{ image.get_250w_url }} 250w, {{ image.get_700w_url }} 700w, {{ image.get_1200w_url }} 1200w"
      {% endif %}
      sizes="100vw"
      width="700"{% if image.extended.image_file_exists %} height="{{ image.get_700w_size.1 }}"{% endif %}
      data-caption="{% if image.caption %}{{ image.caption }}{% else %}Foto del artículo '{{ article.headline|remove_markup }}'{% endif %}"
      alt="{% if image.caption %}{{ image.caption }}{% else %}Foto del artículo '{{ article.headline|remove_markup }}'{% endif %}"
      loading="lazy"
    >
    {% if image.caption or image.extended.photographer %}
      <figcaption class="article-caption ld-caption">
        {% if image.caption %}<p>{{ image.caption|ldmarkup|bleach }}</p>{% endif %}
        {% if image.extended.photographer %}
          <p>{{ image.extended.get_type_display }}: {{ image.extended.photographer }}</p>
        {% endif %}
      </figcaption>
    {% endif %}
  </figure>
</div>
{% endif %}
