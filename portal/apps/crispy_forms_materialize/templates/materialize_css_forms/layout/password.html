<div id="div_id_{{ field.name }}" class="validate input-field{% if field.errors and form_show_errors %} error{% endif %}">
  <label for="id_{{ field.name }}" class="required active">
    {{ field.label }}
    <span class="asterisk asterisk-password">*</span>
  </label>
  {{ field }}
  <span data-toggle="#id_{{ field.name }}" class="toggle-password visibility"></span>
  {% for error in field.errors %}
    <small id="error_{{ forloop.counter }}_id_{{ field.name }}" class="error red-text">
      {{ error }}
    </small>
  {% endfor %}
</div>
