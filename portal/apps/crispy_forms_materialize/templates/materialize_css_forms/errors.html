{% if form.errors and form.non_field_errors %}
  {% spaceless %}
    <div class="alert-box">
      {% if form_error_title %}<span class="title">{{ form_error_title }}</span>{% endif %}
        <ul>
          {% for error in form.non_field_errors %}
            <li>{{ error|safe }}</li>
          {% endfor %}
        </ul>
    </div>
  {% endspaceless %}
{% endif %}
