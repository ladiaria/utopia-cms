{% extends "admin/change_list.html" %}

{% block result_list %}
<div style="margin-bottom:12px;">
    <a href="/homev4/preview-5am/" target="_blank" class="button">
        Preparar 5am ↗
    </a>
</div>
{{ block.super }}
<style>
  #result_list tbody tr.active-layout-row td,
  #result_list tbody tr.active-layout-row th {
    background-color: #e8f5e9 !important;
  }
</style>
<script>
(function () {
  var active = new Set({{ active_layout_pks|safe }});
  document.querySelectorAll("#result_list tbody tr").forEach(function (tr) {
    var link = tr.querySelector("th a, td a");
    if (!link) return;
    var m = link.href.match(/\/(\d+)\/change\//);
    if (m && active.has(parseInt(m[1]))) {
      tr.classList.add("active-layout-row");
    }
  });
}());
</script>
{% endblock %}
