{% load core_tags %}

<div class="sidebar__block">
  <div class="sidebar__block-title">
    <a href="{% block more_link %}#{% endblock %}">
      <h2>{{ comp.label }}</h2>
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="#000" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="m8 21.5 6-6-6-6"/></svg>
    </a>
  </div>
  <div class="sidebar__articles-container">
    {% block articles %}
      {% for article in comp.articles %}
        <article class="article">
          {% render_toolbar_for article %}
          <h3 class="article__title">
            <a href="{{ article.get_absolute_url }}">{{ article.headline }}</a>
          </h3>
        </article>
      {% endfor %}
    {% endblock %}
  </div>
</div>
