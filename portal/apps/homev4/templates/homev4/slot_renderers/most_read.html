<div class="slot-title">Más leídos</div>
{% if most_read_articles %}
    {% for article in most_read_articles %}
    <div class="article-item">
        <h3><a href="{{ article.get_absolute_url }}">{{ article.headline }}</a></h3>
        <p class="meta">{{ article.date_published|date:"d/m/Y" }}</p>
    </div>
    {% endfor %}
{% else %}
    <div class="empty-slot">No hay datos de más leídos</div>
{% endif %}
