<div class="slot-title">
    {% if area_url %}<a href="{{ area_url }}">{{ area_name }}</a>{% else %}{{ area_name }}{% endif %}
</div>
{% if articles %}
    {% for article in articles %}
    <div class="article-item">
        <h3><a href="{{ article.get_absolute_url }}">{{ article.headline }}</a></h3>
        {% if article.deck %}<p class="deck">{{ article.deck }}</p>{% endif %}
    </div>
    {% endfor %}
{% else %}
    <div class="empty-slot">Sin artículos recientes</div>
{% endif %}
