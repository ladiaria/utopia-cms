{% load homev4_tags %}
<div class="grid-layout" style="display:grid; grid-template-columns:repeat(12,1fr); gap:16px; max-width:1200px;">
    {% for slot in grid_data %}
    <div style="grid-column: {{ slot.grid_column_start }} / span {{ slot.grid_column_span }};
                grid-row: {{ slot.grid_row_start }} / span {{ slot.grid_row_span }};
                background:#fff; border:1px solid #ddd; border-radius:4px; padding:16px; min-height:80px;">
        {% render_slot slot %}
    </div>
    {% empty %}
    <div style="grid-column: 1 / span 12; text-align:center; color:#999; padding:20px;">
        No hay bloques en este layout.
    </div>
    {% endfor %}
</div>
